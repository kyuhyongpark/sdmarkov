[project]
name = "sdmarkov"
version = "0.1.0"
description = "Tools for generaing coarse-grained Markov chain for Boolean networks"
authors = [{ name = "Kyu Hyong Park", email = "kyuhyongpark@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "biobalm",
    "networkx",
    "numpy",
    "pyboolnet @ git+https://github.com/hklarner/pyboolnet",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "hypothesis",
    "ipykernel",
    "lxml",
    "matplotlib",
    "pandas",
    "pystablemotifs",
    "pytest",
    "seaborn",
]
gpu = [
    "cupy-cuda11x==13.6.0",
    "cubewalkers @ git+https://github.com/jcrozum/cubewalkers",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"